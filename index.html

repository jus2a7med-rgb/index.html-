<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى ندائي 💕 | 13/8/2024</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <style>
    :root { --primary: #ff4d6d; --secondary: #c77dff; --gold: #ffb703; --bg-dark: #0b091a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: #f8f9fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }
    
    /* زر التحكم في الموسيقى */
    .audio-control-btn { position: fixed; top: 15px; left: 15px; z-index: 100; background: rgba(255, 77, 109, 0.25); border: 1px solid var(--primary); color: #fff; padding: 8px 15px; border-radius: 30px; cursor: pointer; display: none; }

    .container { width: 92%; max-width: 680px; margin: 20px auto; padding: 25px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 24px; text-align: center; }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.8s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .light-btn { width: 100px; height: 100px; border-radius: 50%; background: #ff4d6d; border: none; cursor: pointer; font-size: 3rem; margin: 20px auto; box-shadow: 0 0 30px rgba(255, 77, 109, 0.5); }
    .story-card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; text-align: right; margin: 20px 0; }
    .btn { background: var(--primary); color: white; padding: 10px 25px; border: none; border-radius: 20px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>

  <!-- صوت الخلفية -->
  <audio id="bgMusic" loop src="https://files.catbox.moe/lER2VtVPJDA.mp3"></audio>
  
  <button class="audio-control-btn" id="audioToggleBtn" onclick="toggleAudio()">
    <span id="audioIcon">🎵</span> <span id="audioText">إيقاف</span>
  </button>

  <div class="container">
    <!-- Step 1 -->
    <div class="step active" id="step-1">
      <h1>إلى نِداء قلبي 💕</h1>
      <button class="light-btn" onclick="startExperience()">💡</button>
      <p>اضغطي هنا لبدء الحكاية</p>
    </div>

    <!-- Step 2 -->
    <div class="step" id="step-2">
      <h2 id="chapterTitle">الحكاية</h2>
      <div class="story-card" id="storyContent"></div>
      <button class="btn" onclick="changeChapter(-1)">السابق</button>
      <button class="btn" onclick="changeChapter(1)">التالي</button>
    </div>

    <!-- Step 3 -->
    <div class="step" id="step-3">
      <h2>هدية بسيطة 🎁</h2>
      <button class="btn" onclick="restart()">إعادة الحكاية</button>
    </div>
  </div>

  <script>
    const chapters = [
      "مرحباً ندائي.. هذه بداية حكايتنا.",
      "في مثل هذا اليوم.. تغير كل شيء.",
      "أنتِ كالشروق في حياتي.",
      "نهاية حكايتنا الحالية."
    ];
    let currentChapter = 0;
    let isPlaying = false;

    function startExperience() {
      // 1. الانتقال للواجهة التالية فوراً
      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');
      
      // 2. محاولة تشغيل الموسيقى
      const music = document.getElementById('bgMusic');
      music.play().then(() => {
        isPlaying = true;
        document.getElementById('audioToggleBtn').style.display = 'block';
      }).catch(() => {
        // إذا فشل التشغيل (بسبب سياسة المتصفح)، يظهر الزر أيضاً
        document.getElementById('audioToggleBtn').style.display = 'block';
      });

      renderChapter();
    }

    function toggleAudio() {
      const music = document.getElementById('bgMusic');
      if (isPlaying) { music.pause(); isPlaying = false; document.getElementById('audioIcon').textContent = '🔇'; }
      else { music.play(); isPlaying = true; document.getElementById('audioIcon').textContent = '🎵'; }
    }

    function renderChapter() {
      document.getElementById('storyContent').innerHTML = chapters[currentChapter];
    }

    function changeChapter(dir) {
      currentChapter += dir;
      if (currentChapter < 0) currentChapter = 0;
      if (currentChapter >= chapters.length) {
        document.getElementById('step-2').classList.remove('active');
        document.getElementById('step-3').classList.add('active');
        return;
      }
      renderChapter();
    }
    
    function restart() { location.reload(); }
  </script>
</body>
</html>
